name: Update Malayalam Playlist

on:
  schedule:
    # Runs every 4 hours
    - cron: "0 */4 * * *"
  workflow_dispatch:   # allows manual run from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run playlist updater
        run: python .github/scripts/update_malayalam_playlist.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/hooks/malayalam-playlist.m3u

          if git diff --staged --quiet; then
            echo "No changes detected"
          else
            git commit -m "chore: update Malayalam playlist $(date -u +%Y-%m-%d)"
            git push
          fi
